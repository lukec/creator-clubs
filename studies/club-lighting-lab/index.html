  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;div id=&quot;club-lighting-lab&quot;&gt;
  &lt;header class=&quot;lighting-intro&quot;&gt;

    &lt;p&gt;Paint the paired internal sources, tune how the white plastic carries their light, then roll or flip the club to inspect the result.&lt;/p&gt;
  &lt;/header&gt;

  &lt;div class=&quot;viz-controls&quot;&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;lighting-model&quot;&gt;

        &lt;option value=&quot;hybrid&quot;&gt;Reference hybrid&lt;/option&gt;
        &lt;option value=&quot;diffusion&quot;&gt;Shell diffusion&lt;/option&gt;
        &lt;option value=&quot;direct&quot;&gt;Direct transmission&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;lighting-pattern&quot;&gt;
      Pattern preset
      &lt;select class=&quot;form-select&quot; id=&quot;lighting-pattern&quot;&gt;
        &lt;option value=&quot;reference&quot;&gt;Official-photo gradient&lt;/option&gt;
        &lt;option value=&quot;handle&quot;&gt;One handle pair&lt;/option&gt;
        &lt;option value=&quot;body&quot;&gt;One body pair&lt;/option&gt;
        &lt;option value=&quot;adjacent&quot;&gt;Adjacent red + blue&lt;/option&gt;
        &lt;option value=&quot;alternating&quot;&gt;Alternating red + blue&lt;/option&gt;
        &lt;option value=&quot;white&quot;&gt;All white&lt;/option&gt;
        &lt;option value=&quot;off&quot;&gt;LEDs off&lt;/option&gt;
        &lt;option value=&quot;custom&quot;&gt;Custom DSL&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;lighting-roll&quot;&gt;
      Roll · long axis &lt;span id=&quot;lighting-roll-value&quot;&gt;0°&lt;/span&gt;
      &lt;input class=&quot;form-range&quot; id=&quot;lighting-roll&quot; type=&quot;range&quot; min=&quot;-180&quot; max=&quot;180&quot; step=&quot;1&quot; value=&quot;0&quot;&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;lighting-flip&quot;&gt;

      &lt;input class=&quot;form-range&quot; id=&quot;lighting-flip&quot; type=&quot;range&quot; min=&quot;-180&quot; max=&quot;180&quot; step=&quot;1&quot; value=&quot;-27&quot;&gt;

    &lt;label class=&quot;form-label&quot; for=&quot;lighting-motion&quot;&gt;
      Preview motion
      &lt;select class=&quot;form-select&quot; id=&quot;lighting-motion&quot;&gt;
        &lt;option value=&quot;still&quot;&gt;Still&lt;/option&gt;
        &lt;option value=&quot;roll&quot;&gt;Auto roll&lt;/option&gt;
        &lt;option value=&quot;flip&quot;&gt;Auto flip&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
  &lt;/div&gt;

  &lt;div class=&quot;lighting-stage&quot; id=&quot;lighting-stage&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;lighting-caption text-small&quot; id=&quot;lighting-model-note&quot; aria-live=&quot;polite&quot;&gt;
    Handle hotspots remain visible while the wider body blends into a luminous field.
  &lt;/div&gt;
  &lt;div class=&quot;lighting-pose-note text-small text-muted&quot;&gt;
    Roll rotates around the club&#x27;s own shaft. Flip pivots around the published 28&amp;nbsp;cm balance point.
  &lt;/div&gt;

  &lt;div class=&quot;source-strip&quot; id=&quot;lighting-source-strip&quot; role=&quot;img&quot; aria-label=&quot;Sixteen axial stations, each with two opposite-facing RGB sources&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;strip-key text-small text-muted&quot;&gt;

  &lt;/div&gt;

  &lt;section class=&quot;lighting-dsl-card&quot; aria-labelledby=&quot;lighting-dsl-heading&quot;&gt;
    &lt;div class=&quot;lighting-dsl-heading&quot;&gt;
      &lt;div&gt;
        &lt;strong id=&quot;lighting-dsl-heading&quot;&gt;Glow DSL v0&lt;/strong&gt;
        &lt;div class=&quot;text-small text-muted&quot;&gt;Editable browser source · provisional &lt;code&gt;paired16-v0&lt;/code&gt; layout&lt;/div&gt;
      &lt;/div&gt;
      &lt;button class=&quot;btn btn-ghost&quot; id=&quot;lighting-copy-dsl&quot; type=&quot;button&quot;&gt;Copy DSL&lt;/button&gt;

      &lt;button class=&quot;btn btn-primary&quot; id=&quot;lighting-apply-dsl&quot; type=&quot;button&quot;&gt;Apply source&lt;/button&gt;
      &lt;span class=&quot;text-small&quot; id=&quot;lighting-dsl-status&quot; aria-live=&quot;polite&quot;&gt;Ready&lt;/span&gt;

      &lt;summary&gt;DSL quick reference&lt;/summary&gt;
      &lt;p&gt;&lt;code&gt;both&lt;/code&gt;, &lt;code&gt;side-a&lt;/code&gt;, or &lt;code&gt;side-b&lt;/code&gt; paints club-local sources. Select &lt;code&gt;all&lt;/code&gt;, &lt;code&gt;handle&lt;/code&gt;, &lt;code&gt;body&lt;/code&gt;, &lt;code&gt;odd&lt;/code&gt;, &lt;code&gt;even&lt;/code&gt;, a station, or a range such as &lt;code&gt;4..12&lt;/code&gt;. Paint a hex color, an exact list, &lt;code&gt;tile(...)&lt;/code&gt;, or &lt;code&gt;ramp(#00dfff -&amp;gt; #ff2aa8)&lt;/code&gt;. Press &lt;kbd&gt;⌘&lt;/kbd&gt;&lt;kbd&gt;Enter&lt;/kbd&gt; to apply.&lt;/p&gt;
    &lt;/details&gt;

    &lt;label class=&quot;form-label&quot; for=&quot;lighting-brightness&quot;&gt;

    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;lighting-body-diffusion&quot;&gt;
      Body spread &lt;span id=&quot;lighting-body-value&quot;&gt;1.00×&lt;/span&gt;
      &lt;input class=&quot;form-range&quot; id=&quot;lighting-body-diffusion&quot; type=&quot;range&quot; min=&quot;0.35&quot; max=&quot;2.4&quot; step=&quot;0.05&quot; value=&quot;1&quot;&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;lighting-exposure&quot;&gt;
      Camera exposure &lt;span id=&quot;lighting-exposure-value&quot;&gt;1.18×&lt;/span&gt;
      &lt;input class=&quot;form-range&quot; id=&quot;lighting-exposure&quot; type=&quot;range&quot; min=&quot;0.35&quot; max=&quot;2.5&quot; step=&quot;0.01&quot; value=&quot;1.18&quot;&gt;
    &lt;/label&gt;
  &lt;/div&gt;

      &lt;input class=&quot;form-check-input&quot; id=&quot;lighting-sources&quot; type=&quot;checkbox&quot;&gt;
      &lt;span class=&quot;form-check-label&quot;&gt;Cutaway sources&lt;/span&gt;

    &lt;button class=&quot;btn btn-primary&quot; id=&quot;lighting-copy&quot; type=&quot;button&quot;&gt;Copy settings&lt;/button&gt;
    &lt;a class=&quot;btn btn-ghost&quot; href=&quot;https://flowtoys.com/cdn/shop/products/vision-clubs-smooth-body-single-led-glow-juggling-club.jpg?v=1778275800&amp;amp;width=1200&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;Official reference&lt;/a&gt;

  &lt;div class=&quot;text-small text-muted lighting-status&quot; id=&quot;lighting-status&quot; aria-live=&quot;polite&quot;&gt;
    16 paired stations · 32 SK9822 RGB packages · perceived glow, not measured lumens

  &lt;details class=&quot;lighting-method text-small&quot;&gt;

    &lt;p&gt;&lt;strong&gt;Published construction:&lt;/strong&gt; 515 × 82&amp;nbsp;mm Henrys Pirouette-derived shape, translucent PE-blend body, polycarbonate shaft, EVA knob, silicone cap, and 32 controlled RGB packages. Flowtoys markets 96 high-brightness LEDs, consistent with counting three emitting dies per RGB package.&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;Working hypothesis:&lt;/strong&gt; the 32 packages are shown as 16 opposite-facing pairs because that matches Luke&#x27;s physical observation; the exact electrical-to-physical index map is not yet measured. Glow and diffusion are perceptual browser fits—not calibrated lumens, plastic scattering coefficients, or a substitute for a real-club test.&lt;/p&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&quot;club-lighting-lab&quot;);
  const stage = root.querySelector(&quot;#lighting-stage&quot;);
  const modelInput = root.querySelector(&quot;#lighting-model&quot;);
  const patternInput = root.querySelector(&quot;#lighting-pattern&quot;);
  const rollInput = root.querySelector(&quot;#lighting-roll&quot;);
  const rollValue = root.querySelector(&quot;#lighting-roll-value&quot;);
  const flipInput = root.querySelector(&quot;#lighting-flip&quot;);
  const flipValue = root.querySelector(&quot;#lighting-flip-value&quot;);
  const motionInput = root.querySelector(&quot;#lighting-motion&quot;);
  const dslInput = root.querySelector(&quot;#lighting-dsl&quot;);
  const dslStatus = root.querySelector(&quot;#lighting-dsl-status&quot;);
  const applyDslButton = root.querySelector(&quot;#lighting-apply-dsl&quot;);
  const copyDslButton = root.querySelector(&quot;#lighting-copy-dsl&quot;);
  const brightnessInput = root.querySelector(&quot;#lighting-brightness&quot;);
  const brightnessValue = root.querySelector(&quot;#lighting-brightness-value&quot;);
  const handleInput = root.querySelector(&quot;#lighting-handle-diffusion&quot;);
  const handleValue = root.querySelector(&quot;#lighting-handle-value&quot;);
  const bodyInput = root.querySelector(&quot;#lighting-body-diffusion&quot;);
  const bodyValue = root.querySelector(&quot;#lighting-body-value&quot;);
  const exposureInput = root.querySelector(&quot;#lighting-exposure&quot;);
  const exposureValue = root.querySelector(&quot;#lighting-exposure-value&quot;);
  const sourcesInput = root.querySelector(&quot;#lighting-sources&quot;);
  const inspectionInput = root.querySelector(&quot;#lighting-inspection&quot;);
  const resetButton = root.querySelector(&quot;#lighting-reset&quot;);
  const copyButton = root.querySelector(&quot;#lighting-copy&quot;);
  const modelNote = root.querySelector(&quot;#lighting-model-note&quot;);
  const status = root.querySelector(&quot;#lighting-status&quot;);
  const strip = root.querySelector(&quot;#lighting-source-strip&quot;);
  const reducedMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches;
  const dsl = globalThis.CreatorClubLightingLab.dsl;

  const modelNotes = {
    direct: &quot;Crisp direct transmission exposes the two fixed source faces with very little plastic scatter.&quot;,
    diffusion: &quot;A broad analytic shell kernel smooths each source through the handle and body.&quot;,
    hybrid: &quot;Handle hotspots remain visible while the wider body blends into a luminous field.&quot;,
  };

  const sourceDots = Array.from({ length: 16 }, (_, station) =&gt; {
    const pair = document.createElement(&quot;span&quot;);
    pair.className = &quot;source-pair&quot;;
    pair.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
    const front = document.createElement(&quot;span&quot;);
    const back = document.createElement(&quot;span&quot;);
    front.className = &quot;source-dot&quot;;
    back.className = &quot;source-dot&quot;;
    pair.append(front, back);
    strip.append(pair);
    return [front, back];
  });

  const lab = globalThis.CreatorClubLightingLab.create({ mount: stage });
  let currentFrame = dsl.compile(dsl.presets.reference);
  let currentDocument = dsl.compileDocument(dsl.presets.reference);
  let animationFrame = 0;
  let animationStart = 0;
  let animationStartValue = 0;
  let dslTimer = 0;

  const paintDot = (dot, color) =&gt; {
    const peak = Math.max(...color);
    if (peak === 0) {
      dot.style.removeProperty(&quot;background&quot;);
      dot.style.removeProperty(&quot;box-shadow&quot;);
      return;
    }
    const css = `rgb(${color.join(&quot;,&quot;)})`;
    dot.style.background = css;
    dot.style.boxShadow = `0 0 7px ${css}`;
  };

  const updateStrip = () =&gt; {
    sourceDots.forEach(([front, back], station) =&gt; {
      paintDot(front, currentFrame[station]);
      paintDot(back, currentFrame[station + 16]);
    });
  };

  const updateParams = () =&gt; {
    const brightness = Number(brightnessInput.value);
    const handleDiffusion = Number(handleInput.value);
    const bodyDiffusion = Number(bodyInput.value);
    const exposure = Number(exposureInput.value);
    brightnessValue.textContent = `${brightness.toFixed(2)}×`;
    handleValue.textContent = `${handleDiffusion.toFixed(2)}×`;
    bodyValue.textContent = `${bodyDiffusion.toFixed(2)}×`;
    exposureValue.textContent = `${exposure.toFixed(2)}×`;
    lab.setParams({
      brightness,
      handleDiffusion,
      bodyDiffusion,
      exposure,
      inspection: inspectionInput.checked,
    });
  };

  const applyDsl = ({ quiet = false } = {}) =&gt; {
    try {
      currentDocument = dsl.compileDocument(dslInput.value);
      currentFrame = currentDocument.frame;
      lab.setFrame(currentFrame);
      updateStrip();
      dslStatus.classList.remove(&quot;is-error&quot;);
      dslStatus.textContent = `${currentDocument.pattern || &quot;Untitled&quot;} · 32 RGB values ready`;
      if (!quiet) status.textContent = &quot;Browser preview updated from Glow DSL&quot;;
      return true;
    } catch (error) {
      dslStatus.classList.add(&quot;is-error&quot;);
      dslStatus.textContent = error.message;
      return false;
    }
  };

  const updatePattern = () =&gt; {
    if (patternInput.value === &quot;custom&quot;) return;
    dslInput.value = dsl.presets[patternInput.value];
    applyDsl({ quiet: true });
  };

  const updateModel = () =&gt; {
    lab.setModel(modelInput.value);
    modelNote.textContent = modelNotes[modelInput.value];
  };

  const formatDegrees = (value) =&gt; `${value &lt; 0 ? &quot;−&quot; : &quot;&quot;}${Math.abs(Math.round(value))}°`;

  const updatePoseLabels = () =&gt; {
    rollValue.textContent = formatDegrees(Number(rollInput.value));
    flipValue.textContent = formatDegrees(Number(flipInput.value));
  };

  const stopMotion = () =&gt; {
    cancelAnimationFrame(animationFrame);
    animationFrame = 0;
    animationStart = 0;
  };

  const animatePose = (time) =&gt; {
    if (motionInput.value === &quot;still&quot;) return;
    if (!animationStart) animationStart = time;
    const unwrapped = animationStartValue + (time - animationStart) * 0.025;
    const degrees = ((unwrapped + 180) % 360 + 360) % 360 - 180;
    if (motionInput.value === &quot;roll&quot;) {
      rollInput.value = String(Math.round(degrees));
      lab.setRoll(degrees);
    } else {
      flipInput.value = String(Math.round(degrees));
      lab.setFlip(degrees);
    }
    updatePoseLabels();
    animationFrame = requestAnimationFrame(animatePose);
  };

  const startMotion = () =&gt; {
    stopMotion();
    if (motionInput.value === &quot;still&quot; || reducedMotion) return;
    animationStartValue = Number(motionInput.value === &quot;roll&quot; ? rollInput.value : flipInput.value);
    animationFrame = requestAnimationFrame(animatePose);
  };

  const copyText = async (value) =&gt; {
    try {
      await navigator.clipboard.writeText(value);
    } catch {
      const fallback = document.createElement(&quot;textarea&quot;);
      fallback.value = value;
      fallback.setAttribute(&quot;readonly&quot;, &quot;&quot;);
      root.append(fallback);
      fallback.select();
      document.execCommand(&quot;copy&quot;);
      fallback.remove();
    }
  };

  modelInput.addEventListener(&quot;change&quot;, updateModel);
  patternInput.addEventListener(&quot;change&quot;, updatePattern);
  rollInput.addEventListener(&quot;input&quot;, () =&gt; {
    motionInput.value = &quot;still&quot;;
    stopMotion();
    lab.setRoll(Number(rollInput.value));
    updatePoseLabels();
  });
  flipInput.addEventListener(&quot;input&quot;, () =&gt; {
    motionInput.value = &quot;still&quot;;
    stopMotion();
    lab.setFlip(Number(flipInput.value));
    updatePoseLabels();
  });
  motionInput.addEventListener(&quot;change&quot;, startMotion);
  dslInput.addEventListener(&quot;input&quot;, () =&gt; {
    patternInput.value = &quot;custom&quot;;
    window.clearTimeout(dslTimer);
    dslTimer = window.setTimeout(() =&gt; applyDsl({ quiet: true }), 260);
  });
  dslInput.addEventListener(&quot;keydown&quot;, (event) =&gt; {
    if ((event.metaKey || event.ctrlKey) &amp;&amp; event.key === &quot;Enter&quot;) {
      event.preventDefault();
      window.clearTimeout(dslTimer);
      applyDsl();
    }
  });
  applyDslButton.addEventListener(&quot;click&quot;, () =&gt; {
    window.clearTimeout(dslTimer);
    applyDsl();
  });
  copyDslButton.addEventListener(&quot;click&quot;, async () =&gt; {
    await copyText(dslInput.value);
    copyDslButton.textContent = &quot;Copied&quot;;
    window.setTimeout(() =&gt; { copyDslButton.textContent = &quot;Copy DSL&quot;; }, 1200);
  });
  [brightnessInput, handleInput, bodyInput, exposureInput].forEach((input) =&gt; {
    input.addEventListener(&quot;input&quot;, updateParams);
  });
  sourcesInput.addEventListener(&quot;change&quot;, () =&gt; lab.showSources(sourcesInput.checked));
  inspectionInput.addEventListener(&quot;change&quot;, updateParams);

  resetButton.addEventListener(&quot;click&quot;, () =&gt; {
    stopMotion();
    modelInput.value = &quot;hybrid&quot;;
    patternInput.value = &quot;reference&quot;;
    rollInput.value = &quot;0&quot;;
    flipInput.value = &quot;-27&quot;;
    motionInput.value = &quot;still&quot;;
    brightnessInput.value = &quot;1&quot;;
    handleInput.value = &quot;1&quot;;
    bodyInput.value = &quot;1&quot;;
    exposureInput.value = &quot;1.18&quot;;
    sourcesInput.checked = false;
    inspectionInput.checked = false;
    lab.setRoll(0);
    lab.setFlip(-27);
    lab.showSources(false);
    updatePoseLabels();
    updateModel();
    updatePattern();
    updateParams();
    status.textContent = &quot;Defaults restored · hybrid model · dark venue&quot;;
  });

  copyButton.addEventListener(&quot;click&quot;, async () =&gt; {
    const state = lab.getState();
    const summary = [
      &quot;Club lighting&quot;,
      `model=${state.model}`,
      `pattern=${currentDocument.pattern || &quot;custom&quot;}`,
      `glow=${state.params.brightness.toFixed(2)}`,
      `handle=${state.params.handleDiffusion.toFixed(2)}`,
      `body=${state.params.bodyDiffusion.toFixed(2)}`,
      `exposure=${state.params.exposure.toFixed(2)}`,
      `roll=${Math.round(state.roll)}`,
      `flip=${Math.round(state.flip)}`,
      `sources=${state.showSources ? &quot;on&quot; : &quot;off&quot;}`,
      `light=${state.params.inspection ? &quot;inspection&quot; : &quot;dark&quot;}`,
    ].join(&quot; &quot;);
    await copyText(summary);
    status.textContent = summary;
    copyButton.textContent = &quot;Copied&quot;;
    window.setTimeout(() =&gt; { copyButton.textContent = &quot;Copy settings&quot;; }, 1200);
  });

  dslInput.value = dsl.presets.reference;
  updateModel();
  applyDsl({ quiet: true });
  updateParams();
  updatePoseLabels();
  if (reducedMotion) {
    motionInput.value = &quot;still&quot;;
    motionInput.disabled = true;
  }
})();
&lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
