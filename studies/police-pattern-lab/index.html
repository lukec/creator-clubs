  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;div id=&quot;police-pattern-lab&quot;&gt;
  &lt;div class=&quot;viz-controls&quot;&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;police-speed&quot;&gt;
      Speed &lt;span id=&quot;police-speed-value&quot;&gt;1.0×&lt;/span&gt;
      &lt;input class=&quot;form-range&quot; id=&quot;police-speed&quot; type=&quot;range&quot; min=&quot;0.5&quot; max=&quot;2&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;
    &lt;/label&gt;
    &lt;button class=&quot;btn btn-primary&quot; id=&quot;police-play&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;
      &lt;i data-lucide=&quot;pause&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
      &lt;span&gt;Pause&lt;/span&gt;
    &lt;/button&gt;
    &lt;button class=&quot;btn&quot; id=&quot;police-copy&quot; type=&quot;button&quot;&gt;
      &lt;i data-lucide=&quot;copy&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
      &lt;span&gt;Copy picks&lt;/span&gt;
    &lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;selection-line&quot; id=&quot;police-selection&quot; aria-live=&quot;polite&quot;&gt;Picks: none&lt;/div&gt;
  &lt;div class=&quot;pattern-list&quot; id=&quot;police-patterns&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;juggle-preview&quot; id=&quot;police-juggle-preview&quot; hidden&gt;
    &lt;div class=&quot;viz-row&quot;&gt;
      &lt;span id=&quot;police-juggle-label&quot;&gt;Juggling preview&lt;/span&gt;
      &lt;button class=&quot;btn btn-ghost&quot; id=&quot;police-juggle-close&quot; type=&quot;button&quot;&gt;Close&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;juggle-stage&quot; id=&quot;police-juggle-stage&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;text-small text-muted&quot;&gt;Fixed audience camera · one pattern cloned across all three clubs&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;strip-key text-small text-muted&quot;&gt;
    &lt;span&gt;Handle LEDs 1–16&lt;/span&gt;&lt;span&gt;Body LEDs 17–32&lt;/span&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;style&gt;
  #police-pattern-lab {
    color: var(--foreground);
    width: 100%;
  }
  #police-pattern-lab .viz-controls {
    align-items: end;
  }
  #police-pattern-lab .form-label {
    min-width: 180px;
  }
  #police-pattern-lab .selection-line {
    margin: 10px 0 6px;
    min-height: 1.5em;
  }
  #police-pattern-lab .pattern-row {
    display: grid;
    grid-template-columns: minmax(150px, 190px) minmax(0, 1fr);
    gap: 12px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    content-visibility: auto;
    contain-intrinsic-size: auto 54px;
  }
  #police-pattern-lab .pattern-label,
  #police-pattern-lab .pattern-actions {
    min-width: 0;
  }
  #police-pattern-lab .pattern-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    flex-wrap: wrap;
  }
  #police-pattern-lab .pattern-description {
    display: block;
    margin-top: 2px;
  }
  #police-pattern-lab .led-strip {
    display: grid;
    grid-template-columns: repeat(32, minmax(3px, 1fr));
    gap: 2px;
    align-items: center;
    padding: 7px;
    background: color-mix(in srgb, var(--muted) 72%, transparent);
    border-radius: 999px;
    contain: layout paint;
  }
  #police-pattern-lab .led {
    min-width: 3px;
    height: 24px;
    border-radius: 999px;
    box-shadow:
      0 0 0 var(--emission-ring, 0) currentColor,
      inset 0 1px 0 rgb(255 255 255 / 52%),
      inset 0 -1px 0 rgb(0 0 0 / 18%);
  }
  #police-pattern-lab .led.body-start {
    margin-left: 4px;
  }
  #police-pattern-lab .juggle-preview {
    padding: 12px 0 16px;
    border-bottom: 1px solid var(--border);
  }
  #police-pattern-lab .juggle-preview .viz-row {
    justify-content: space-between;
    margin-bottom: 6px;
  }
  #police-pattern-lab .juggle-stage {
    width: 100%;
    height: clamp(250px, 52vw, 380px);
    overflow: hidden;
    color: CanvasText;
    color-scheme: dark;
    background: Canvas;
  }
  #police-pattern-lab .juggle-stage canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #police-pattern-lab .strip-key {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 8px 7px 0 min(202px, 27vw);
    text-align: center;
  }
  @media (max-width: 560px) {
    #police-pattern-lab .pattern-row {
      grid-template-columns: 1fr;
      gap: 7px;
    }
    #police-pattern-lab .led {
      height: 20px;
    }
    #police-pattern-lab .juggle-stage {
      height: 300px;
    }
    #police-pattern-lab .strip-key {
      margin-left: 7px;
    }
  }
&lt;/style&gt;

    const key = `${red},${green},${blue}`;
    if (!ledStyleCache.has(key)) {
      const gain = window.CreatorClub3D.chromaEmissionGain(
        [red, green, blue].map(srgbToLinear),
      );
      ledStyleCache.set(key, {
        color: `rgb(${red} ${green} ${blue})`,
        ring: `${Math.min(2, Math.max(0, Math.round((gain - 1) * 0.35)))}px`,
      });
    }
    return ledStyleCache.get(key);
  };

  const patterns = [
    {
      name: &quot;Full pursuit&quot;,
      description: &quot;Whole-club red/blue alternation&quot;,
      render: (index, time) =&gt; color(Math.floor(time / 0.32) % 2 === 0 ? RED : BLUE),
    },
    {
      name: &quot;Double tap&quot;,
      description: &quot;Two red hits, then two blue hits&quot;,
      render: (index, time) =&gt; {
        const step = Math.floor(time / 0.18) % 4;
        const base = step &lt; 2 ? RED : BLUE;
        return color(base, step % 2 === 0 ? 1 : 0.72);
      },
    },
    {
      name: &quot;Roadblock 50/50&quot;,
      description: &quot;Accepted split swaps once per beat&quot;,
      render: (index, time) =&gt; {
        const swap = Math.floor(time / 0.64) % 2;
        return index &lt; 16 ? (swap ? BLUE : RED) : (swap ? RED : BLUE);
      },
    },
    {
      name: &quot;Body alarm&quot;,
      description: &quot;Large body leads; handle answers&quot;,
      render: (index, time) =&gt; {
        const swap = Math.floor(time / 0.32) % 2;
        const body = swap ? RED : BLUE;
        const handle = swap ? BLUE : RED;
        if (index === 31 &amp;&amp; Math.floor(time / 0.16) % 2 === 0) return WHITE;
        return index &lt; 16 ? color(handle, 0.76) : body;
      },
    },
    {
      name: &quot;White scanner&quot;,
      description: &quot;Broad white scan over a police split&quot;,
      render: (index, time) =&gt; {
        const cycle = (time % 2.4) / 2.4;
        const head = Math.round((cycle &lt; 0.5 ? cycle * 2 : 2 - cycle * 2) * 31);
        const distance = Math.abs(index - head);
        if (distance &lt;= 1) return WHITE;
        if (distance &lt;= 3) return color(WHITE, 0.72);
        return index &lt; 16 ? BLUE : RED;
      },
    },
    {
      name: &quot;Braided bands&quot;,
      description: &quot;Four-LED red/blue blocks advance&quot;,
      render: (index, time) =&gt; {
        const shift = Math.floor(time / 0.18) % 8;
        return Math.floor((index + shift) / 4) % 2 === 0 ? RED : BLUE;
      },
    },
    {
      name: &quot;Twin beacons&quot;,
      description: &quot;Opposed white heads with colored tails&quot;,
      render: (index, time) =&gt; {
        const headA = Math.floor((time * 7) % LEDS);
        const headB = (headA + 16) % LEDS;
        const distanceA = circularDistance(index, headA);
        const distanceB = circularDistance(index, headB);
        if (distanceA &lt;= 1 || distanceB &lt;= 1) return WHITE;
        if (distanceA &lt;= 4) return RED;
        if (distanceB &lt;= 4) return BLUE;
        return index &lt; 16 ? color(BLUE, 0.72) : color(RED, 0.72);
      },
    },
    {
      name: &quot;Three-zone dispatch&quot;,
      description: &quot;Red, blue, and white zones rotate&quot;,
      render: (index, time) =&gt; {
        const shift = Math.floor(time / 0.64) % 3;
        const zone = Math.min(2, Math.floor(index / 11));
        return [BLUE, RED, WHITE][(zone + shift) % 3];
      },
    },
  ];

  const rows = patterns.map((pattern, patternIndex) =&gt; {
    const row = document.createElement(&quot;div&quot;);
    row.className = &quot;pattern-row&quot;;

    const label = document.createElement(&quot;div&quot;);
    label.className = &quot;pattern-label&quot;;
    const actions = document.createElement(&quot;div&quot;);
    actions.className = &quot;pattern-actions&quot;;
    const checkWrap = document.createElement(&quot;div&quot;);
    checkWrap.className = &quot;form-check&quot;;
    const checkbox = document.createElement(&quot;input&quot;);
    checkbox.className = &quot;form-check-input&quot;;
    checkbox.type = &quot;checkbox&quot;;
    checkbox.id = `police-pattern-${patternIndex + 1}`;
    checkbox.dataset.pattern = String(patternIndex + 1);
    const checkLabel = document.createElement(&quot;label&quot;);
    checkLabel.className = &quot;form-check-label&quot;;
    checkLabel.htmlFor = checkbox.id;
    checkLabel.textContent = `${patternIndex + 1}. ${pattern.name}`;
    checkWrap.append(checkbox, checkLabel);
    const juggleButton = document.createElement(&quot;button&quot;);
    juggleButton.className = &quot;btn btn-ghost&quot;;
    juggleButton.type = &quot;button&quot;;
    juggleButton.textContent = &quot;Juggle&quot;;
    juggleButton.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
    juggleButton.setAttribute(&quot;aria-label&quot;, `Juggle ${pattern.name}`);
    actions.append(checkWrap, juggleButton);
    const description = document.createElement(&quot;span&quot;);
    description.className = &quot;pattern-description text-small text-muted&quot;;
    description.textContent = pattern.description;
    label.append(actions, description);

    const strip = document.createElement(&quot;div&quot;);
    strip.className = &quot;led-strip&quot;;
    strip.setAttribute(&quot;role&quot;, &quot;img&quot;);
    strip.setAttribute(&quot;aria-label&quot;, `${pattern.name}: ${pattern.description}, animated across 32 LEDs`);
    const leds = Array.from({ length: LEDS }, (_, ledIndex) =&gt; {
      const led = document.createElement(&quot;span&quot;);
      led.className = `led${ledIndex === 16 ? &quot; body-start&quot; : &quot;&quot;}`;
      led.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
      strip.append(led);
      return led;
    });
    row.append(label, strip);
    list.append(row);
    return {
      ...pattern,
      row,
      checkbox,
      juggleButton,
      leds,
      frame: Array.from({ length: LEDS }, () =&gt; [0, 0, 0]),
      lastRgb: Array.from({ length: LEDS }, () =&gt; &quot;&quot;),
    };
  });

  let speed = Number(speedInput.value);
  let paused = reducedMotion;
  let animationTime = 0.78;
  let previousTimestamp = null;
  let previousRenderTimestamp = -Infinity;
  let selectedPreview = null;
  let clubPreview = null;
  let previewFailed = false;

  const ensurePreview = () =&gt; {
    if (previewFailed) return null;
    if (!clubPreview) {
      try {
        clubPreview = window.CreatorClub3D.createCreatorClubPreview({
          mount: previewStage,
          ariaLabel: &quot;Three illuminated Creator Clubs juggling the selected police pattern&quot;,
        });
      } catch (error) {
        previewFailed = true;
        previewStage.textContent = `3D preview unavailable: ${error.message}`;
        rows.forEach((row) =&gt; { row.juggleButton.disabled = true; });
        return null;
      }
    }
    return clubPreview;
  };

  const updatePicks = () =&gt; {
    const picks = rows
      .map((row, index) =&gt; row.checkbox.checked ? String(index + 1) : null)
      .filter(Boolean);
    selection.textContent = `Picks: ${picks.length ? picks.join(&quot;, &quot;) : &quot;none&quot;}`;
  };

  const closePreview = () =&gt; {
    if (selectedPreview !== null) rows[selectedPreview].juggleButton.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
    selectedPreview = null;
    previewHost.hidden = true;
  };

  const openPreview = (patternIndex) =&gt; {
    if (selectedPreview === patternIndex &amp;&amp; !previewHost.hidden) {
      closePreview();
      return;
    }
    rows.forEach((row, index) =&gt; row.juggleButton.setAttribute(&quot;aria-pressed&quot;, String(index === patternIndex)));
    selectedPreview = patternIndex;
    previewLabel.textContent = `${patternIndex + 1}. ${rows[patternIndex].name} · juggling preview`;
    rows[patternIndex].row.after(previewHost);
    previewHost.hidden = false;
    ensurePreview()?.render(reducedMotion ? 0.78 : animationTime, rows[patternIndex].frame);
  };

  const render = () =&gt; {
    rows.forEach((pattern) =&gt; {
      pattern.leds.forEach((led, ledIndex) =&gt; {
        const [red, green, blue] = pattern.render(ledIndex, animationTime);
        const frameColor = pattern.frame[ledIndex];
        frameColor[0] = red;
        frameColor[1] = green;
        frameColor[2] = blue;
        const key = `${red},${green},${blue}`;
        if (pattern.lastRgb[ledIndex] !== key) {
          pattern.lastRgb[ledIndex] = key;
          const style = ledStyleFor(red, green, blue);
          led.style.backgroundColor = style.color;
          led.style.color = style.color;
          led.style.setProperty(&quot;--emission-ring&quot;, style.ring);
        }
      });
    });
    if (selectedPreview !== null &amp;&amp; !previewHost.hidden) {
      ensurePreview()?.render(reducedMotion ? 0.78 : animationTime, rows[selectedPreview].frame);
    }
  };

  const animate = (timestamp) =&gt; {
    if (previousTimestamp === null) previousTimestamp = timestamp;
    const elapsed = Math.min(0.05, (timestamp - previousTimestamp) / 1000);
    previousTimestamp = timestamp;
    if (!paused) {
      animationTime += elapsed * speed;
      if (timestamp - previousRenderTimestamp &gt;= FRAME_INTERVAL) {
        previousRenderTimestamp = timestamp;
        render();
      }
    }
    window.requestAnimationFrame(animate);
  };

  speedInput.addEventListener(&quot;input&quot;, () =&gt; {
    speed = Number(speedInput.value);
    speedValue.textContent = `${speed.toFixed(1)}×`;
  });
  playButton.addEventListener(&quot;click&quot;, () =&gt; {
    paused = !paused;
    previousTimestamp = null;
    previousRenderTimestamp = -Infinity;
    playButton.setAttribute(&quot;aria-pressed&quot;, String(paused));
    playLabel.textContent = paused ? &quot;Play&quot; : &quot;Pause&quot;;
    playIcon.setAttribute(&quot;data-lucide&quot;, paused ? &quot;play&quot; : &quot;pause&quot;);
    if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
  });
  rows.forEach((row, index) =&gt; {
    row.checkbox.addEventListener(&quot;change&quot;, updatePicks);
    row.juggleButton.addEventListener(&quot;click&quot;, () =&gt; openPreview(index));
  });
  previewClose.addEventListener(&quot;click&quot;, closePreview);
  copyButton.addEventListener(&quot;click&quot;, async () =&gt; {
    const text = selection.textContent.replace(&quot;Picks:&quot;, &quot;Police picks:&quot;);
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const input = document.createElement(&quot;textarea&quot;);
      input.value = text;
      input.setAttribute(&quot;readonly&quot;, &quot;&quot;);
      input.style.position = &quot;absolute&quot;;
      input.style.left = &quot;-9999px&quot;;
      root.append(input);
      input.select();
      document.execCommand(&quot;copy&quot;);
      input.remove();
    }
    copyLabel.textContent = &quot;Copied&quot;;
    window.setTimeout(() =&gt; { copyLabel.textContent = &quot;Copy picks&quot;; }, 1200);
  });

  if (paused) {
    playButton.setAttribute(&quot;aria-pressed&quot;, &quot;true&quot;);
    playLabel.textContent = &quot;Play&quot;;
    playIcon.setAttribute(&quot;data-lucide&quot;, &quot;play&quot;);
  }
  render();
  updatePicks();
  window.requestAnimationFrame(animate);
})();
&lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
