:root[data-theme=&quot;light&quot;] {

h3,

}

b,

}

.table-responsive &gt; .table :is(th, td) {

}

.table :is(th, td):last-child {

}

.table :is(caption, thead th) {

}

.table thead th {

}

.card {

  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {

  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),

  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {

  line-height: 1.25;
}

  align-items: center;
  gap: 10px;
}

  background: var(--accent);

}

.sr-only {

  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;

.viz-controls {

  align-items: center;
  gap: 8px;

  gap: 2px 12px;

.btn,

.btn {

  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;

a.btn {

  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {

.btn-primary:not(:disabled):hover {

.btn-ghost:not(:disabled):hover {

  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

  opacity: 0.4;

[data-lucide] {

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);

  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;

  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);

  color: var(--foreground);
  background-color: var(--secondary);
  background-image:

.form-check-input {

  width: 14px;

  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

      slot.sensor.roll = pose.rollDegrees;
      slot.sensor.projectedAngle = pose.projectedAngle;
      slot.sensor.activityPercent = pose.activity * 100;
      slot.sensor.throwState = pose.throwState;
      if (selected.kind === &quot;wasm&quot;) {
        slot.instance?.exports.update();
      } else {
        window.CreatorClub3D.renderThemeEffect(
          effect.id,
          slot.sensor,
          timeSeconds,
          slot.frame,
        );
      }
    });
  };

  const closePreview = () =&gt; {
    if (selectedPreview !== null) rows[selectedPreview].juggle.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
    selectedPreview = null;
    previewHost.hidden = true;
    renderRows();
  };
  const placePreviewNear = (effectIndex) =&gt; {
    const visibleRows = rows.filter((row) =&gt; !row.row.hidden);
    const selectedPosition = visibleRows.findIndex((row) =&gt; row.index === effectIndex);
    const renderedColumns = getComputedStyle(patternList).gridTemplateColumns
      .split(/\s+/)
      .filter(Boolean)
      .length || 1;
    const rowEndPosition = Math.min(
      visibleRows.length - 1,
      Math.ceil((selectedPosition + 1) / renderedColumns) * renderedColumns - 1,
    );
    visibleRows[rowEndPosition].row.after(previewHost);
  };
  const openPreview = (effectIndex) =&gt; {
    if (selectedPreview === effectIndex &amp;&amp; !previewHost.hidden) {
      closePreview();
      return;
    }
    rows.forEach((row, index) =&gt; row.juggle.setAttribute(&quot;aria-pressed&quot;, String(index === effectIndex)));
    selectedPreview = effectIndex;
    const selected = selection();
    const effect = selected.effects[effectIndex];
    previewLabel.textContent = `${selected.label}E${effectIndex + 1} · ${effect.name} · juggling preview`;
    placePreviewNear(effectIndex);
    previewHost.hidden = false;
    syncPreviewSelection();
    updatePreviewFrames();
    ensurePreview()?.render(previewTime(), previewSlots.map((slot) =&gt; slot.frame));
    window.requestAnimationFrame(() =&gt; previewHost.scrollIntoView({
      behavior: reducedMotion ? &quot;auto&quot; : &quot;smooth&quot;,
      block: &quot;nearest&quot;,
    }));
  };

  const updateLabels = () =&gt; {
    rollValue.textContent = `${state.roll &lt; 0 ? &quot;−&quot; : &quot;&quot;}${Math.abs(Math.round(state.roll))}°`;
    flipValue.textContent = `${Math.round(state.projectedAngle * 360)}°`;
    rollFace.style.setProperty(&quot;--pose-angle&quot;, `${state.roll}deg`);
    flipClub.style.setProperty(&quot;--pose-angle&quot;, `${state.projectedAngle * 360}deg`);
    rollInput.setAttribute(&quot;aria-valuetext&quot;, `${Math.abs(Math.round(state.roll))} degrees ${state.roll &lt; 0 ? &quot;counterclockwise&quot; : &quot;clockwise&quot;}`);
    const flipDegrees = Math.round(state.projectedAngle * 360) % 360;
    const flipDirection = [&quot;body up&quot;, &quot;body right&quot;, &quot;body down&quot;, &quot;body left&quot;][Math.round(flipDegrees / 90) % 4];
    flipInput.setAttribute(&quot;aria-valuetext&quot;, `${flipDegrees} degrees, ${flipDirection}`);
    if (state.activityMode === &quot;motion&quot;) {
      activityInput.value = String(Math.round(state.activityPercent));
    }
    activityValue.textContent = `${Math.round(state.activityPercent)}%${state.activityMode === &quot;motion&quot; ? &quot; · motion&quot; : &quot;&quot;}`;
    activityInput.setAttribute(
      &quot;aria-valuetext&quot;,
      `${Math.round(state.activityPercent)} percent${state.activityMode === &quot;motion&quot; ? &quot;, derived from pose motion&quot; : &quot;, manual&quot;}`,
    );
  };

  const selectPage = () =&gt; {
    closePreview();
    const selected = selection();
    rows.forEach((row, effectIndex) =&gt; {
      const effect = selected.effects[effectIndex];
      const visible = Boolean(effect);
      row.row.hidden = !visible;
      if (!visible) return;
      const exact = selected.kind === &quot;wasm&quot;;
      row.name.textContent = `${selected.label}E${effectIndex + 1} · ${effect.name}`;
      row.description.textContent = effect.description;
      row.row.setAttribute(&quot;aria-label&quot;, `${selected.label}E${effectIndex + 1} ${effect.name}: ${exact ? &quot;exact WebAssembly output&quot; : &quot;Web Studio sketch&quot;} on a simulated Creator Club`);
      row.juggle.setAttribute(&quot;aria-label&quot;, `Juggle ${selected.label}E${effectIndex + 1} ${effect.name}`);
      if (exact &amp;&amp; row.instance) row.instance.exports.diagnosticSelect(selected.pageIndex, effectIndex);
    });
    ensureGallery()?.setActiveCount(selected.effects.length);
    runtimeLine.textContent = selected.kind === &quot;wasm&quot;
      ? `Ready · exact ${state.moduleBytes.toLocaleString()} / 16,000 bytes · 8 live 3D effects · one shared renderer · 50 Hz`
      : `Web Studio sketch · ${selected.effects.length} live 3D effects · browser only, not yet on the club`;
  };

  const setAutoButton = (button, enabled) =&gt; {
    button.setAttribute(&quot;aria-pressed&quot;, String(enabled));
  };
  const autoEnabled = (button) =&gt; button.getAttribute(&quot;aria-pressed&quot;) === &quot;true&quot;;
  const syncMoveButton = () =&gt; {
    setAutoButton(moveButton, autoEnabled(rollAutoButton) &amp;&amp; autoEnabled(flipAutoButton));
  };
  const shortestDegreesDelta = (previous, next) =&gt; Math.abs(
    ((next - previous + 540) % 360) - 180,
  );
  const applyPoseActivity = (deltaDegrees, decay = 0.72) =&gt; {
    state.activityMode = &quot;motion&quot;;
    state.activityPercent = Math.min(
      100,
      Math.max(state.activityPercent * decay, deltaDegrees * 12),
    );
  };
  const stopRollAuto = () =&gt; {
    setAutoButton(rollAutoButton, false);
    syncMoveButton();
  };
  const stopFlipAuto = () =&gt; {
    setAutoButton(flipAutoButton, false);
    syncMoveButton();
  };
  rollInput.addEventListener(&quot;input&quot;, () =&gt; {
    const previous = state.roll;
    stopRollAuto();
    state.roll = Number(rollInput.value);
    applyPoseActivity(shortestDegreesDelta(previous, state.roll));
    updateLabels();
  });
  flipInput.addEventListener(&quot;input&quot;, () =&gt; {
    const previous = state.projectedAngle * 360;
    stopFlipAuto();
    state.projectedAngle = Number(flipInput.value) / 360;
    applyPoseActivity(shortestDegreesDelta(previous, state.projectedAngle * 360));
    updateLabels();
  });
  activityInput.addEventListener(&quot;input&quot;, () =&gt; {
    state.activityMode = &quot;manual&quot;;
    state.activityPercent = Number(activityInput.value);
    updateLabels();
  });
  throwButtons.forEach((button) =&gt; button.addEventListener(&quot;click&quot;, () =&gt; {
    state.throwState = Number(button.dataset.throwState);
    throwButtons.forEach((entry) =&gt; entry.setAttribute(&quot;aria-pressed&quot;, String(entry === button)));
  }));
  rollAutoButton.addEventListener(&quot;click&quot;, () =&gt; {
    setAutoButton(rollAutoButton, !autoEnabled(rollAutoButton));
    if (autoEnabled(rollAutoButton)) state.activityMode = &quot;motion&quot;;
    syncMoveButton();
  });
  flipAutoButton.addEventListener(&quot;click&quot;, () =&gt; {
    setAutoButton(flipAutoButton, !autoEnabled(flipAutoButton));
    if (autoEnabled(flipAutoButton)) state.activityMode = &quot;motion&quot;;
    syncMoveButton();
  });
  moveButton.addEventListener(&quot;click&quot;, () =&gt; {
    const enabled = !autoEnabled(moveButton);
    setAutoButton(rollAutoButton, enabled);
    setAutoButton(flipAutoButton, enabled);
    setAutoButton(moveButton, enabled);
    if (enabled) state.activityMode = &quot;motion&quot;;
  });
  pageSelect.addEventListener(&quot;change&quot;, selectPage);
  rows.forEach((row, index) =&gt; row.juggle.addEventListener(&quot;click&quot;, () =&gt; openPreview(index)));
  previewClose.addEventListener(&quot;click&quot;, closePreview);

  const bindRadialInput = (input, normalizeAngle) =&gt; {
    let activePointer = null;
    const setFromPointer = (event) =&gt; {
      const bounds = input.getBoundingClientRect();
      const x = event.clientX - (bounds.left + bounds.width / 2);
      const y = event.clientY - (bounds.top + bounds.height / 2);
      const clockwiseFromUp = (Math.atan2(y, x) * 180 / Math.PI + 90 + 360) % 360;
      input.value = String(Math.round(normalizeAngle(clockwiseFromUp)));
      input.dispatchEvent(new Event(&quot;input&quot;, { bubbles: true }));
    };
    input.addEventListener(&quot;pointerdown&quot;, (event) =&gt; {
      activePointer = event.pointerId;
      input.focus();
      input.setPointerCapture(event.pointerId);
      setFromPointer(event);
      event.preventDefault();
    });
    input.addEventListener(&quot;pointermove&quot;, (event) =&gt; {
      if (event.pointerId === activePointer) setFromPointer(event);
    });
    const finishPointer = (event) =&gt; {
      if (event.pointerId !== activePointer) return;
      setFromPointer(event);
      activePointer = null;
      if (input.hasPointerCapture(event.pointerId)) input.releasePointerCapture(event.pointerId);
    };
    input.addEventListener(&quot;pointerup&quot;, finishPointer);
    input.addEventListener(&quot;pointercancel&quot;, (event) =&gt; {
      if (event.pointerId === activePointer) activePointer = null;
    });
  };
  bindRadialInput(rollInput, (angle) =&gt; angle &gt; 180 ? angle - 360 : angle);
  bindRadialInput(flipInput, (angle) =&gt; angle);

  const renderRows = () =&gt; {
    if (selectedPreview !== null &amp;&amp; !previewHost.hidden) {
      ensurePreview()?.render(previewTime(), previewSlots.map((slot) =&gt; slot.frame));
    } else {
      ensureGallery()?.render({
        projectedAngle: state.projectedAngle,
        rollDegrees: state.roll,
      }, rows.map((row) =&gt; row.frame));
    }
  };

  const tick = (timestamp) =&gt; {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const elapsed = Math.min(0.10, (timestamp - state.lastTimestamp) / 1000);
    state.lastTimestamp = timestamp;
    state.accumulator += elapsed;
    while (state.accumulator &gt;= 0.02 &amp;&amp; rows[0].instance) {
      state.accumulator -= 0.02;
      state.time += 0.02;
      const previousRoll = state.roll;
      const previousFlipDegrees = state.projectedAngle * 360;
      if (autoEnabled(rollAutoButton)) {
        state.roll = Math.sin(state.time * 0.76) * 175;
        rollInput.value = String(Math.round(state.roll));
      }
      if (autoEnabled(flipAutoButton)) {
        state.projectedAngle = (state.time * 0.29) % 1;
        flipInput.value = String(Math.round(state.projectedAngle * 360));
      }
      if (autoEnabled(rollAutoButton) || autoEnabled(flipAutoButton)) {
        const motionDegrees = shortestDegreesDelta(previousRoll, state.roll)
          + shortestDegreesDelta(previousFlipDegrees, state.projectedAngle * 360);
        applyPoseActivity(motionDegrees, 0.86);
      } else if (state.activityMode === &quot;motion&quot;) {
        state.activityPercent *= 0.92;
        if (state.activityPercent &lt; 0.1) state.activityPercent = 0;
      }
      if (autoEnabled(rollAutoButton) || autoEnabled(flipAutoButton) || state.activityMode === &quot;motion&quot;) {
        updateLabels();
      }
      const selected = selection();
      const started = performance.now();
      if (selected.kind === &quot;wasm&quot;) {
        rows.forEach((row) =&gt; {
          row.instance.exports.update();
          assert(row.instance.exports.memory.buffer.byteLength &lt;= 4096, `P${selected.pageIndex + 1}E${row.index + 1} exceeded 4096-byte memory ceiling`);
        });
      } else {
        selected.effects.forEach((effect, index) =&gt; {
          window.CreatorClub3D.renderThemeEffect(effect.id, state, state.time, rows[index].frame);
        });
      }
      updatePreviewFrames();
      state.updateSamples.push(performance.now() - started);
      if (state.updateSamples.length &gt; 250) state.updateSamples.shift();
    }
    if (timestamp - state.lastRenderTimestamp &gt;= FRAME_INTERVAL) {
      state.lastRenderTimestamp = timestamp;
      renderRows();
    }
    if (rows[0].instance &amp;&amp; Math.floor(timestamp / 500) !== Math.floor((timestamp - elapsed * 1000) / 500)) {
      const selected = selection();
      const sorted = [...state.updateSamples].sort((a, b) =&gt; a - b);
      const p95 = sorted[Math.floor(sorted.length * 0.95)] || 0;
      runtimeLine.textContent = selected.kind === &quot;wasm&quot;
        ? `Ready · exact ${state.moduleBytes.toLocaleString()} / 16,000 bytes · 8 live 3D effects · one shared renderer · 50 Hz · WASM p95 ${p95.toFixed(3)} ms`
        : `Web Studio sketch · ${selected.effects.length} live 3D effects · browser only · render p95 ${p95.toFixed(3)} ms`;
    }
    window.requestAnimationFrame(tick);
  };

  const boot = async () =&gt; {
    try {
      const binary = Uint8Array.from(atob(WASM_BASE64), (character) =&gt; character.charCodeAt(0));
      state.moduleBytes = binary.length;
      assert(binary.length &lt;= 16000, `module is ${binary.length} bytes`);
      const module = await WebAssembly.compile(binary);
      const imports = WebAssembly.Module.imports(module).map((item) =&gt; `${item.module}.${item.name}`);
      assert(imports.every((name) =&gt; name.startsWith(&quot;arduino.&quot;)), `unsupported import: ${imports.join(&quot;, &quot;)}`);
      for (const row of rows) {
        const instance = await WebAssembly.instantiate(module, { arduino: makeArduino(row) });
        row.instance = instance;
        assert(instance.exports.memory.buffer.byteLength &lt;= 4096, &quot;initial WASM memory exceeds 4096 bytes&quot;);
        row.phase = &quot;init&quot;;
        instance.exports.init();
        assert(row.initHardwareCalls.length === 0, `P1E${row.index + 1} init touched hardware: ${row.initHardwareCalls.join(&quot;, &quot;)}`);
        row.phase = &quot;running&quot;;
      }
      for (const slot of previewSlots) {
        const instance = await WebAssembly.instantiate(module, {
          arduino: makeArduino(slot, slot.sensor),
        });
        slot.instance = instance;
        assert(instance.exports.memory.buffer.byteLength &lt;= 4096, &quot;preview WASM memory exceeds 4096 bytes&quot;);
        slot.phase = &quot;init&quot;;
        instance.exports.init();
        assert(slot.initHardwareCalls.length === 0, `Preview club ${slot.index} init touched hardware: ${slot.initHardwareCalls.join(&quot;, &quot;)}`);
        slot.phase = &quot;running&quot;;
      }
      selectPage();
      state.time += 0.02;
      rows.forEach((row) =&gt; {
        row.instance.exports.update();
        assert(row.imuEnabled === 1, `E${row.index + 1} first update did not enable IMU`);
      });
      previewSlots.forEach((slot) =&gt; {
        slot.instance.exports.update();
        assert(slot.imuEnabled === 1, `Preview club ${slot.index} first update did not enable IMU`);
      });
      syncPreviewSelection();
      updatePreviewFrames();
      renderRows();
      const selected = selection();
      runtimeLine.textContent = selected.kind === &quot;wasm&quot;
        ? `Ready · exact ${binary.length.toLocaleString()} / 16,000 bytes · 8 live 3D effects · one shared renderer · 50 Hz`
        : `Web Studio sketch · ${selected.effects.length} live 3D effects · browser only, not yet on the club`;
    } catch (error) {
      runtimeLine.classList.add(&quot;is-error&quot;);
      runtimeLine.textContent = `Emulator error: ${error.message}`;
    }
  };

  updateLabels();
  selectPage();
  boot();
  window.requestAnimationFrame(tick);
})();
&lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
