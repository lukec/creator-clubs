  const exactPages = [

    description.className = "pattern-description text-small text-muted";
    heading.append(name);
    label.append(heading, description);
    row.append(label, juggle);
    patternList.append(row);
    return {
      index,
      row,
      name,
      description,
      juggle,
      frame: Array.from({ length: 32 }, () => [0, 0, 0]),

    index,
    frame: Array.from({ length: 32 }, () => [0, 0, 0]),
    instance: null,
    phase: "loading",
    imuEnabled: 0,
    initHardwareCalls: [],
    sensor: {
      time: 0,
      roll: 0,
      projectedAngle: 0,
      activityPercent: 0,
      throwState: 0,
    },

  let selectedPreview = null;
  let clubPreview = null;
  let previewFailed = false;
  let clubGallery = null;

  const assert = (condition, message) => {
    if (!condition) throw new Error(message);
  };
  const channel = (value) => {
    assert(Number.isInteger(value) && value >= 0 && value <= 255, `invalid RGB channel ${value}`);
    return value;
  };
  const makeArduino = (slot, sensors = state) => {
    const record = (name) => {
      if (slot.phase === "init" && name !== "printInt") slot.initHardwareCalls.push(name);
    };
    const setAll = (red, green, blue) => {
      const rgb = [channel(red), channel(green), channel(blue)];
      slot.frame.forEach((led) => led.splice(0, 3, ...rgb));
    };
    return {
      clearLeds() { record("clearLeds"); setAll(0, 0, 0); },
      fillLedsRGB(red, green, blue) { record("fillLedsRGB"); setAll(red, green, blue); },
      setLedRGB(index, red, green, blue) {
        record("setLedRGB");
        assert(Number.isInteger(index) && index >= 0 && index < 32, `invalid LED ${index}`);
        slot.frame[index].splice(0, 3, channel(red), channel(green), channel(blue));
      },
      getButtonState() { record("getButtonState"); return 0; },
      setIMUEnabled(value) { record("setIMUEnabled"); slot.imuEnabled = value ? 1 : 0; },
      getProjectedAngle() { record("getProjectedAngle"); return Math.fround(sensors.projectedAngle); },
      getRoll() { record("getRoll"); return Math.fround(sensors.roll); },
      getActivity() {
        record("getActivity");
        return Math.fround(0.005976 + sensors.activityPercent / 100 * 0.546515);
      },
      getThrowState() { record("getThrowState"); return sensors.throwState; },
      getTime() { record("getTime"); return Math.fround(sensors.time ?? state.time); },
      printInt() {},
    };
  };

  const ensureGallery = () => {
    if (galleryFailed) return null;
    if (!clubGallery) {
      try {
        clubGallery = window.CreatorClub3D.createCreatorClubGallery({
          mount: patternList,
          tileElements: rows.map((row) => row.row),
          ariaLabel: "Illuminated Creator Clubs showing every effect in the selected Motion Lab collection",
        });
      } catch (error) {
        galleryFailed = true;
        runtimeLine.classList.add("is-error");
        runtimeLine.textContent = `3D gallery unavailable: ${error.message}`;
      }
    }
    return clubGallery;
  };

  const ensurePreview = () => {
    if (previewFailed) return null;
    if (!clubPreview) {
      try {
        clubPreview = window.CreatorClub3D.createCreatorClubPreview({
          mount: previewStage,
          ariaLabel: "Three illuminated Creator Clubs juggling the selected Motion Lab effect",
        });
      } catch (error) {
        previewFailed = true;
        previewStage.textContent = `3D preview unavailable: ${error.message}`;
        rows.forEach((row) => { row.juggle.disabled = true; });
        return null;
      }
    }
    return clubPreview;
  };

  const previewTime = () => reducedMotion ? 0.78 : state.time;
  const syncPreviewSelection = () => {
    if (selectedPreview === null) return;
    const selected = selection();
    if (selected.kind !== "wasm") return;
    previewSlots.forEach((slot) => {
      slot.instance?.exports.diagnosticSelect(selected.pageIndex, selectedPreview);
    });
  };
  const updatePreviewFrames = (timeSeconds = previewTime()) => {
    if (selectedPreview === null || previewHost.hidden) return;
    const selected = selection();
    const effect = selected.effects[selectedPreview];
    const poses = window.CreatorClub3D.sampleThreeClubCascade(timeSeconds);
    previewSlots.forEach((slot, index) => {
      const pose = poses[index];
      slot.sensor.time = timeSeconds;
      slot.sensor.roll = pose.rollDegrees;
      slot.sensor.projectedAngle = pose.projectedAngle;
      slot.sensor.activityPercent = pose.activity * 100;
      slot.sensor.throwState = pose.throwState;
      if (selected.kind === "wasm") {
        slot.instance?.exports.update();
      } else {
        window.CreatorClub3D.renderThemeEffect(
          effect.id,
          slot.sensor,
          timeSeconds,
          slot.frame,
        );
      }
    });
  };

  const closePreview = () => {
    if (selectedPreview !== null) rows[selectedPreview].juggle.setAttribute("aria-pressed", "false");
    selectedPreview = null;
    previewHost.hidden = true;
    renderRows();
  };
  const placePreviewNear = (effectIndex) => {
    const visibleRows = rows.filter((row) => !row.row.hidden);
    const selectedPosition = visibleRows.findIndex((row) => row.index === effectIndex);
    const renderedColumns = getComputedStyle(patternList).gridTemplateColumns
      .split(/\s+/)
      .filter(Boolean)
      .length || 1;
    const rowEndPosition = Math.min(
      visibleRows.length - 1,
      Math.ceil((selectedPosition + 1) / renderedColumns) * renderedColumns - 1,
    );
    visibleRows[rowEndPosition].row.after(previewHost);
  };
  const openPreview = (effectIndex) => {
    if (selectedPreview === effectIndex && !previewHost.hidden) {
      closePreview();
      return;
    }
    rows.forEach((row, index) => row.juggle.setAttribute("aria-pressed", String(index === effectIndex)));
    selectedPreview = effectIndex;
    const selected = selection();
    const effect = selected.effects[effectIndex];
    previewLabel.textContent = `${selected.label}E${effectIndex + 1} · ${effect.name} · juggling preview`;
    placePreviewNear(effectIndex);
    previewHost.hidden = false;
    syncPreviewSelection();
    updatePreviewFrames();
    ensurePreview()?.render(previewTime(), previewSlots.map((slot) => slot.frame));
    window.requestAnimationFrame(() => previewHost.scrollIntoView({
      behavior: reducedMotion ? "auto" : "smooth",
      block: "nearest",
    }));
  };

  const updateLabels = () => {
    rollValue.textContent = `${state.roll < 0 ? "−" : ""}${Math.abs(Math.round(state.roll))}°`;
    flipValue.textContent = `${Math.round(state.projectedAngle * 360)}°`;
    rollFace.style.setProperty("--pose-angle", `${state.roll}deg`);
    flipClub.style.setProperty("--pose-angle", `${state.projectedAngle * 360}deg`);
    rollInput.setAttribute("aria-valuetext", `${Math.abs(Math.round(state.roll))} degrees ${state.roll < 0 ? "counterclockwise" : "clockwise"}`);
    const flipDegrees = Math.round(state.projectedAngle * 360) % 360;
    const flipDirection = ["body up", "body right", "body down", "body left"][Math.round(flipDegrees / 90) % 4];
    flipInput.setAttribute("aria-valuetext", `${flipDegrees} degrees, ${flipDirection}`);
    if (state.activityMode === "motion") {
      activityInput.value = String(Math.round(state.activityPercent));
    }
    activityValue.textContent = `${Math.round(state.activityPercent)}%${state.activityMode === "motion" ? " · motion" : ""}`;
    activityInput.setAttribute(
      "aria-valuetext",
      `${Math.round(state.activityPercent)} percent${state.activityMode === "motion" ? ", derived from pose motion" : ", manual"}`,
    );
  };

  const selectPage = () => {
    closePreview();
    const selected = selection();
    rows.forEach((row, effectIndex) => {
      const effect = selected.effects[effectIndex];
      const visible = Boolean(effect);
      row.row.hidden = !visible;
      if (!visible) return;
      const exact = selected.kind === "wasm";
      row.name.textContent = `${selected.label}E${effectIndex + 1} · ${effect.name}`;
      row.description.textContent = effect.description;
      row.row.setAttribute("aria-label", `${selected.label}E${effectIndex + 1} ${effect.name}: ${exact ? "exact WebAssembly output" : "Web Studio sketch"} on a simulated Creator Club`);
      row.juggle.setAttribute("aria-label", `Juggle ${selected.label}E${effectIndex + 1} ${effect.name}`);
      if (exact && row.instance) row.instance.exports.diagnosticSelect(selected.pageIndex, effectIndex);
    });
    ensureGallery()?.setActiveCount(selected.effects.length);
    runtimeLine.textContent = selected.kind === "wasm"
      ? `Ready · exact ${state.moduleBytes.toLocaleString()} / 16,000 bytes · 8 live 3D effects · one shared renderer · 50 Hz`
      : `Web Studio sketch · ${selected.effects.length} live 3D effects · browser only, not yet on the club`;
  };

  const setAutoButton = (button, enabled) => {
    button.setAttribute("aria-pressed", String(enabled));
  };
  const autoEnabled = (button) => button.getAttribute("aria-pressed") === "true";
  const syncMoveButton = () => {
    setAutoButton(moveButton, autoEnabled(rollAutoButton) && autoEnabled(flipAutoButton));
  };
  const shortestDegreesDelta = (previous, next) => Math.abs(
    ((next - previous + 540) % 360) - 180,
  );
  const applyPoseActivity = (deltaDegrees, decay = 0.72) => {
    state.activityMode = "motion";
    state.activityPercent = Math.min(
      100,
      Math.max(state.activityPercent * decay, deltaDegrees * 12),
    );
  };
  const stopRollAuto = () => {
    setAutoButton(rollAutoButton, false);
    syncMoveButton();
  };
  const stopFlipAuto = () => {
    setAutoButton(flipAutoButton, false);
    syncMoveButton();
  };
  rollInput.addEventListener("input", () => {
    const previous = state.roll;
    stopRollAuto();
    state.roll = Number(rollInput.value);
    applyPoseActivity(shortestDegreesDelta(previous, state.roll));
    updateLabels();
  });
  flipInput.addEventListener("input", () => {
    const previous = state.projectedAngle * 360;
    stopFlipAuto();
    state.projectedAngle = Number(flipInput.value) / 360;
    applyPoseActivity(shortestDegreesDelta(previous, state.projectedAngle * 360));
    updateLabels();
  });
  activityInput.addEventListener("input", () => {
    state.activityMode = "manual";
    state.activityPercent = Number(activityInput.value);
    updateLabels();
  });
  throwButtons.forEach((button) => button.addEventListener("click", () => {
    state.throwState = Number(button.dataset.throwState);
    throwButtons.forEach((entry) => entry.setAttribute("aria-pressed", String(entry === button)));
  }));
  rollAutoButton.addEventListener("click", () => {
    setAutoButton(rollAutoButton, !autoEnabled(rollAutoButton));
    if (autoEnabled(rollAutoButton)) state.activityMode = "motion";
    syncMoveButton();
  });
  flipAutoButton.addEventListener("click", () => {
    setAutoButton(flipAutoButton, !autoEnabled(flipAutoButton));
    if (autoEnabled(flipAutoButton)) state.activityMode = "motion";
    syncMoveButton();
  });
  moveButton.addEventListener("click", () => {
    const enabled = !autoEnabled(moveButton);
    setAutoButton(rollAutoButton, enabled);
    setAutoButton(flipAutoButton, enabled);
    setAutoButton(moveButton, enabled);
    if (enabled) state.activityMode = "motion";
  });
  pageSelect.addEventListener("change", selectPage);
  rows.forEach((row, index) => row.juggle.addEventListener("click", () => openPreview(index)));
  previewClose.addEventListener("click", closePreview);

  const bindRadialInput = (input, normalizeAngle) => {
    let activePointer = null;
    const setFromPointer = (event) => {
      const bounds = input.getBoundingClientRect();
      const x = event.clientX - (bounds.left + bounds.width / 2);
      const y = event.clientY - (bounds.top + bounds.height / 2);
      const clockwiseFromUp = (Math.atan2(y, x) * 180 / Math.PI + 90 + 360) % 360;
      input.value = String(Math.round(normalizeAngle(clockwiseFromUp)));
      input.dispatchEvent(new Event("input", { bubbles: true }));
    };
    input.addEventListener("pointerdown", (event) => {
      activePointer = event.pointerId;
      input.focus();
      input.setPointerCapture(event.pointerId);
      setFromPointer(event);
      event.preventDefault();
    });
    input.addEventListener("pointermove", (event) => {
      if (event.pointerId === activePointer) setFromPointer(event);
    });
    const finishPointer = (event) => {
      if (event.pointerId !== activePointer) return;
      setFromPointer(event);
      activePointer = null;
      if (input.hasPointerCapture(event.pointerId)) input.releasePointerCapture(event.pointerId);
    };
    input.addEventListener("pointerup", finishPointer);
    input.addEventListener("pointercancel", (event) => {
      if (event.pointerId === activePointer) activePointer = null;
    });
  };
  bindRadialInput(rollInput, (angle) => angle > 180 ? angle - 360 : angle);
  bindRadialInput(flipInput, (angle) => angle);

  const renderRows = () => {
    if (selectedPreview !== null && !previewHost.hidden) {
      ensurePreview()?.render(previewTime(), previewSlots.map((slot) => slot.frame));
    } else {
      ensureGallery()?.render({
        projectedAngle: state.projectedAngle,
        rollDegrees: state.roll,
      }, rows.map((row) => row.frame));
    }
  };

  const tick = (timestamp) => {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const elapsed = Math.min(0.10, (timestamp - state.lastTimestamp) / 1000);
    state.lastTimestamp = timestamp;
    state.accumulator += elapsed;
    while (state.accumulator >= 0.02 && rows[0].instance) {
      state.accumulator -= 0.02;
      state.time += 0.02;
      const previousRoll = state.roll;
      const previousFlipDegrees = state.projectedAngle * 360;
      if (autoEnabled(rollAutoButton)) {
        state.roll = Math.sin(state.time * 0.76) * 175;
        rollInput.value = String(Math.round(state.roll));
      }
      if (autoEnabled(flipAutoButton)) {
        state.projectedAngle = (state.time * 0.29) % 1;
        flipInput.value = String(Math.round(state.projectedAngle * 360));
      }
      if (autoEnabled(rollAutoButton) || autoEnabled(flipAutoButton)) {
        const motionDegrees = shortestDegreesDelta(previousRoll, state.roll)
          + shortestDegreesDelta(previousFlipDegrees, state.projectedAngle * 360);
        applyPoseActivity(motionDegrees, 0.86);
      } else if (state.activityMode === "motion") {
        state.activityPercent *= 0.92;
        if (state.activityPercent < 0.1) state.activityPercent = 0;
      }
      if (autoEnabled(rollAutoButton) || autoEnabled(flipAutoButton) || state.activityMode === "motion") {
        updateLabels();
      }
      const selected = selection();
      const started = performance.now();
      if (selected.kind === "wasm") {
        rows.forEach((row) => {
          row.instance.exports.update();
          assert(row.instance.exports.memory.buffer.byteLength <= 4096, `P${selected.pageIndex + 1}E${row.index + 1} exceeded 4096-byte memory ceiling`);
        });
      } else {
        selected.effects.forEach((effect, index) => {
          window.CreatorClub3D.renderThemeEffect(effect.id, state, state.time, rows[index].frame);
        });
      }
      updatePreviewFrames();
      state.updateSamples.push(performance.now() - started);
      if (state.updateSamples.length > 250) state.updateSamples.shift();
    }
    if (timestamp - state.lastRenderTimestamp >= FRAME_INTERVAL) {
      state.lastRenderTimestamp = timestamp;
      renderRows();
    }
    if (rows[0].instance && Math.floor(timestamp / 500) !== Math.floor((timestamp - elapsed * 1000) / 500)) {
      const selected = selection();
      const sorted = [...state.updateSamples].sort((a, b) => a - b);
      const p95 = sorted[Math.floor(sorted.length * 0.95)] || 0;
      runtimeLine.textContent = selected.kind === "wasm"
        ? `Ready · exact ${state.moduleBytes.toLocaleString()} / 16,000 bytes · 8 live 3D effects · one shared renderer · 50 Hz · WASM p95 ${p95.toFixed(3)} ms`
        : `Web Studio sketch · ${selected.effects.length} live 3D effects · browser only · render p95 ${p95.toFixed(3)} ms`;
    }
    window.requestAnimationFrame(tick);
  };

  const boot = async () => {
    try {
      const binary = Uint8Array.from(atob(WASM_BASE64), (character) => character.charCodeAt(0));
      state.moduleBytes = binary.length;
      assert(binary.length <= 16000, `module is ${binary.length} bytes`);
      const module = await WebAssembly.compile(binary);
      const imports = WebAssembly.Module.imports(module).map((item) => `${item.module}.${item.name}`);
      assert(imports.every((name) => name.startsWith("arduino.")), `unsupported import: ${imports.join(", ")}`);
      for (const row of rows) {
        const instance = await WebAssembly.instantiate(module, { arduino: makeArduino(row) });
        row.instance = instance;
        assert(instance.exports.memory.buffer.byteLength <= 4096, "initial WASM memory exceeds 4096 bytes");
        row.phase = "init";
        instance.exports.init();
        assert(row.initHardwareCalls.length === 0, `P1E${row.index + 1} init touched hardware: ${row.initHardwareCalls.join(", ")}`);
        row.phase = "running";
      }
      for (const slot of previewSlots) {
        const instance = await WebAssembly.instantiate(module, {
          arduino: makeArduino(slot, slot.sensor),
        });
        slot.instance = instance;
        assert(instance.exports.memory.buffer.byteLength <= 4096, "preview WASM memory exceeds 4096 bytes");
        slot.phase = "init";
        instance.exports.init();
        assert(slot.initHardwareCalls.length === 0, `Preview club ${slot.index} init touched hardware: ${slot.initHardwareCalls.join(", ")}`);
        slot.phase = "running";
      }
      selectPage();
      state.time += 0.02;
      rows.forEach((row) => {
        row.instance.exports.update();
        assert(row.imuEnabled === 1, `E${row.index + 1} first update did not enable IMU`);
      });
      previewSlots.forEach((slot) => {
        slot.instance.exports.update();
        assert(slot.imuEnabled === 1, `Preview club ${slot.index} first update did not enable IMU`);
      });
      syncPreviewSelection();
      updatePreviewFrames();
      renderRows();
      const selected = selection();
      runtimeLine.textContent = selected.kind === "wasm"
        ? `Ready · exact ${binary.length.toLocaleString()} / 16,000 bytes · 8 live 3D effects · one shared renderer · 50 Hz`
        : `Web Studio sketch · ${selected.effects.length} live 3D effects · browser only, not yet on the club`;
    } catch (error) {
      runtimeLine.classList.add("is-error");
      runtimeLine.textContent = `Emulator error: ${error.message}`;
    }
  };

  updateLabels();
  selectPage();
  boot();
  window.requestAnimationFrame(tick);
})();
</script>
